<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiSW Lab｜東吳大學醫務社工 × 人工智慧研究室</title>
<meta name="description" content="AiSW Lab 是東吳大學謝文中老師主持的研究室，研究生成式 AI 如何協助醫務社工撰寫紀錄、處理行政與查詢福利資源。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: #F0EEE9;
    --ink: #111111;
    --muted: #3A3A3A;
    --accent: #C9472F;
    --accent-text: #A8361F;
    --card: #FFFFFF;
    --photo: #DCD8D0;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    font-size: 16px; line-height: 1.7; }
  a { color: var(--ink); }
  a:hover { color: var(--accent-text); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }
  .mono { font-family: 'Space Mono', monospace; font-weight: 700; }
  .display { font-family: 'Anton', 'Noto Sans TC', sans-serif; }
  .red { color: var(--accent); }

  .topline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
    padding-bottom: 12px; border-bottom: 4px solid var(--ink); font-size: 14px; }

  .mast { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px 48px;
    padding: 36px 0 32px; border-bottom: 4px solid var(--ink); }
  .mast .logo { font-size: clamp(56px, 9vw, 112px); line-height: .92; letter-spacing: -1px; white-space: nowrap; }
  .mast .intro { flex: 1 1 380px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
  .mast h1 { margin: 0; font-size: clamp(28px, 3.6vw, 44px); font-weight: 900; line-height: 1.25; }
  .mast p { margin: 0; font-size: 17px; color: var(--muted); max-width: 520px; }

  nav { display: flex; flex-wrap: wrap; background: var(--ink); margin-top: 24px; }
  nav a { flex: 1 1 0; display: flex; align-items: baseline; justify-content: center; gap: 10px;
    color: #fff; text-decoration: none; font-weight: 900; font-size: 17px; padding: 16px 12px;
    border-right: 3px solid var(--bg); transition: background .15s; white-space: nowrap; }
  nav a:last-child { border-right: 0; }
  nav a:hover, nav a.on { background: var(--accent); color: #fff; }

  section { margin-top: 72px; display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 16px; }
  .sec-head { display: flex; align-items: flex-end; gap: 20px; border-bottom: 4px solid var(--ink); padding-bottom: 10px; }
  .sec-head .num { font-size: 64px; line-height: .9; }
  .sec-head h2 { margin: 0; font-size: 32px; font-weight: 900; line-height: 1.2; }

  .box { border: 3px solid var(--ink); background: var(--card); }

  .about p { margin: 0; font-size: 19px; font-weight: 500; line-height: 1.85; white-space: pre-line; }

  .team { display: flex; flex-direction: column; gap: 20px; }
  .team-ra { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; }
  .member { display: flex; flex-wrap: wrap; }
  .member .photo { flex: 0 0 150px; aspect-ratio: 4 / 5; background: var(--photo); border-right: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center; color: #555; font-size: 14px; overflow: hidden; }
  .member.lead .photo { flex-basis: 240px; }
  .member .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
  .member .body { flex: 1 1 220px; min-width: 0; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .member.lead h3 { font-size: 30px; }
  .member.lead .bio { font-size: 16px; }
  .member .role { font-size: 13px; color: var(--accent-text); }
  .member h3 { margin: 0; font-size: 24px; font-weight: 900; }
  .member .title { font-size: 15px; color: var(--muted); }
  .member .bio { margin: 6px 0 0; font-size: 15px; color: var(--muted); }

  .pubs { display: flex; flex-direction: column; gap: 24px; }
  .pub-group .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
    background: var(--ink); color: #fff; padding: 10px 20px; }
  .pub-group .head h3 { margin: 0; font-size: 18px; font-weight: 900; }
  .pub-group .head span { font-size: 13px; }
  .pub-group ol { list-style: none; margin: 0; padding: 0; }
  .pub-group li { padding: 14px 20px 14px calc(20px + 2em); text-indent: -2em; border-top: 2px solid var(--ink); font-size: 15px; }
  .pub-group ol li:first-child { border-top: 0; }
  .pub-group .more-btn { display: block; width: 100%; text-align: left; background: none; border: 0;
    border-top: 2px solid var(--ink); cursor: pointer; padding: 12px 20px; min-height: 44px;
    font: inherit; font-weight: 700; color: var(--ink); }
  .pub-group .more-btn:hover { background: var(--ink); color: #fff; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .pub-group li.shown { animation: fadein .35s ease-out both; }
  .more { align-self: flex-start; font-weight: 700; padding: 10px 0; }

  .products { border: 3px solid var(--ink); }
  .product { display: flex; background: var(--card); border-top: 3px solid var(--ink); transition: background .15s, color .15s; }
  .product:first-child { border-top: 0; }
  .product:hover { background: var(--accent); color: #fff; }
  .product .letter { flex: 0 0 88px; display: flex; align-items: center; justify-content: center;
    border-right: 3px solid var(--ink); font-size: 44px; }
  .product .main { flex: 1 1 auto; min-width: 0; padding: 18px 22px; display: flex; flex-wrap: wrap;
    align-items: center; gap: 12px 24px; }
  .product .info { flex: 1 1 380px; display: flex; flex-direction: column; gap: 4px; }
  .product h3 { margin: 0; font-size: 22px; font-weight: 900; }
  .product p { margin: 0; font-size: 15px; color: var(--muted); }
  .product p { transition: color .15s; }
  .product:hover p { color: #fff; }
  .btn-dark { text-decoration: none; background: var(--ink); color: #fff !important; font-weight: 900;
    padding: 12px 20px; display: inline-flex; align-items: center; min-height: 44px; }
  .tag { border: 3px solid var(--ink); font-weight: 900; padding: 9px 16px; font-size: 15px; }

  .contact > div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 24px; padding: 18px 20px;
    border-top: 2px solid var(--ink); }
  .contact > div:first-child { border-top: 0; }
  .contact .label { flex: 0 0 160px; font-size: 13px; }
  .contact .value { font-size: 20px; font-weight: 700; }

  footer { margin-top: 64px; padding-top: 12px; border-top: 4px solid var(--ink); display: flex;
    flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; font-size: 13px; }

  /* ---------- 動畫 ---------- */
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .mast .logo { animation: wipe .8s cubic-bezier(.7, 0, .2, 1) both; }
  .mast .intro { animation: rise .6s .45s ease-out both; }
  nav { animation: rise .5s .7s ease-out both; }

  .reveal, .member.reveal, .pub-group.reveal { opacity: 0; transform: translateY(28px); box-shadow: none;
    transition: opacity .6s ease-out, transform .6s ease-out; }
  .reveal.in, .member.reveal.in, .pub-group.reveal.in { opacity: 1; transform: none; }
  .sec-head.reveal .num { display: inline-block; transform: translateX(-24px); transition: transform .6s .1s ease-out; }
  .sec-head.reveal.in .num { transform: none; }

  .member, .pub-group, .btn-dark { transition: transform .15s ease-out, box-shadow .15s ease-out; }
  .member:hover, .pub-group:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0 var(--ink); }
  .btn-dark:hover { transform: translate(-3px, -3px); box-shadow: 4px 4px 0 #fff; }
  .product .letter { transition: background .15s, color .15s; }
  .member .photo img { transition: transform .4s ease-out; }
  .member:hover .photo img { transform: scale(1.04); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }

  @media (max-width: 600px) {
    .member.lead .photo { flex-basis: 100%; aspect-ratio: 4 / 3; border-right: 0; border-bottom: 3px solid var(--ink); }
    .member .photo { flex-basis: 110px; }
    .sec-head .num { font-size: 48px; }
    .sec-head h2 { font-size: 26px; }
    nav a { flex: 1 1 30%; padding: 12px 8px; font-size: 15px; border-bottom: 3px solid var(--bg); }
    .product .letter { flex-basis: 56px; font-size: 32px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topline mono">
    <span>AiSW Lab@SCU (東吳大學)</span>
    <span id="email-top"></span>
  </div>

  <header class="mast">
    <div class="logo display">AiSW LAB</div>
    <div class="intro">
      <h1>醫務社工<span class="red">×人工智慧</span></h1>
      <p>東吳大學謝文中老師研究室。研究生成式 AI 如何協助醫務社工撰寫紀錄、處理行政與查詢福利資源。</p>
    </div>
  </header>

  <nav aria-label="主選單">
    <a href="#about">關於我們</a>
    <a href="#team">成員介紹</a>
    <a href="#research">研究發表</a>
    <a href="#products">我們的產品</a>
    <a href="#contact">聯絡我們</a>
  </nav>

  <main>
    <section id="about">
      <div class="sec-head"><span class="num display">01</span><h2>關於我們</h2></div>
      <div class="about">
        <p id="about-text"></p>
      </div>
    </section>

    <section id="team">
      <div class="sec-head"><span class="num display">02</span><h2>成員介紹</h2></div>
      <div class="team" id="members"></div>
    </section>

    <section id="research">
      <div class="sec-head"><span class="num display">03</span><h2>研究發表</h2></div>
      <div class="pubs" id="pubs"></div>
      <a class="more" id="pubs-link" hidden>完整著作清單（系網個人頁）→</a>
    </section>

    <section id="products">
      <div class="sec-head"><span class="num display">04</span><h2>我們的產品</h2></div>
      <div class="products" id="product-list"></div>
    </section>

    <section id="contact">
      <div class="sec-head"><span class="num display">05</span><h2>聯絡我們</h2></div>
      <div class="contact box">
        <div><span class="label mono">EMAIL</span><a class="value" id="email"></a></div>
        <div id="phone-row"><span class="label mono">電話</span><a class="value" id="phone"></a></div>
        <div id="partners"><span class="label mono">PARTNERS / 合作醫院</span><span class="value" id="hospitals"></span></div>
      </div>
    </section>
  </main>

  <footer class="mono">
    <span>© <span id="year"></span> AiSW Lab@SCU<span id="views" hidden> · 瀏覽 <span id="views-n"></span> 次</span></span>
    <span id="affil-foot"></span>
  </footer>
</div>

<script src="content.js"></script>
<script>
(function () {
  var S = window.SITE || {};
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function isUrl(u) { return /^https?:\/\//.test(u || ''); }

  $('email-top').textContent = S.email || '';
  $('email').textContent = S.email || '';
  if (S.email && S.email.indexOf('@') > 0) { $('email').href = 'mailto:' + S.email; }
  if (S.phone) {
    $('phone').textContent = S.phone;
    $('phone').href = 'tel:+886' + S.phone.split(/分機|ext|#/i)[0].replace(/\D/g, '').replace(/^0/, '') +
      (/(分機|ext|#)\s*(\d+)/i.test(S.phone) ? ',' + S.phone.match(/(分機|ext|#)\s*(\d+)/i)[2] : '');
  } else {
    $('phone-row').hidden = true;
  }
  $('about-text').textContent = S.about || '';
  $('affil-foot').textContent = S.affiliation || '';
  $('year').textContent = new Date().getFullYear();

  function memberCard(m, lead) {
    var photo = m.photo ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.name) + '">' : '[照片]';
    var name = isUrl(m.link) ? '<a href="' + esc(m.link) + '">' + esc(m.name) + '</a>' : esc(m.name);
    return '<article class="member box' + (lead ? ' lead' : '') + '"><div class="photo">' + photo + '</div><div class="body">' +
      '<span class="role mono">' + esc(m.role) + '</span><h3>' + name + '</h3>' +
      '<span class="title">' + esc(m.title) + '</span>' +
      (m.bio ? '<p class="bio">' + esc(m.bio) + '</p>' : '') + '</div></article>';
  }
  // role 以 PI 開頭的放最上面一整排，其他成員排在下面
  var members = S.members || [];
  var leads = members.filter(function (m) { return /^PI/i.test(m.role || ''); });
  var others = members.filter(function (m) { return !/^PI/i.test(m.role || ''); });
  $('members').innerHTML = leads.map(function (m) { return memberCard(m, true); }).join('') +
    (others.length ? '<div class="team-ra">' + others.map(function (m) { return memberCard(m, false); }).join('') + '</div>' : '');

  var SHOW = 5;
  function pubItem(t, extra) {
    return '<li' + (extra ? ' hidden' : '') + '>' +
      esc(t).replace(/謝文中|Hsieh, W\. C\./g, '<strong>$&</strong>') + '</li>';
  }
  $('pubs').innerHTML = (S.research || []).filter(function (g) {
    return g.items && g.items.length;
  }).map(function (g) {
    var items = g.items.map(function (t, i) { return pubItem(t, i >= SHOW); }).join('');
    var rest = g.items.length - SHOW;
    var more = rest > 0 ? '<button type="button" class="more-btn">顯示其餘 ' + rest + ' 筆 ↓</button>' : '';
    return '<div class="pub-group box"><div class="head"><h3>' + esc(g.group) + '</h3>' +
      '<span class="mono">' + esc(g.en) + ' · ' + g.items.length + '</span></div>' +
      '<ol>' + items + '</ol>' + more + '</div>';
  }).join('');
  // 點「顯示其餘」後展開全部，按鈕本身消失
  $('pubs').addEventListener('click', function (e) {
    var btn = e.target.closest('.more-btn');
    if (!btn) return;
    var group = btn.parentElement;
    group.querySelectorAll('li[hidden]').forEach(function (li, i) {
      li.hidden = false;
      li.classList.add('shown');
      li.style.animationDelay = Math.min(i, 8) * 0.03 + 's';
    });
    btn.remove();
  });
  if (isUrl(S.publicationsLink)) { $('pubs-link').href = S.publicationsLink; $('pubs-link').hidden = false; }

  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  $('product-list').innerHTML = (S.products || []).map(function (p, i) {
    var open = p.status === '開放使用';
    var action = open && isUrl(p.url)
      ? '<a class="btn-dark" href="' + esc(p.url) + '" target="_blank" rel="noopener">開放使用 · 開啟 ↘</a>'
      : '<span class="tag">' + esc(p.status) + '</span>';
    return '<div class="product' + (open ? ' open' : '') + '"><div class="letter display">' + letters[i % 26] + '</div>' +
      '<div class="main"><div class="info"><h3>' + esc(p.name) + '</h3><p>' + esc(p.desc) + '</p></div>' +
      action + '</div></div>';
  }).join('');

  if (S.hospitals && S.hospitals.length) {
    $('hospitals').textContent = S.hospitals.join('、');
  } else {
    $('partners').hidden = true;
  }

  // 瀏覽次數（GoatCounter）
  var gc = (S.goatcounter || '').trim();
  if (/^[a-z0-9-]+$/.test(gc)) {
    var base = 'https://' + gc + '.goatcounter.com';
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', base + '/count');
    document.body.appendChild(s);
    if (S.showViews && window.fetch) {
      fetch(base + '/counter/TOTAL.json').then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (d) {
        if (d && d.count) { $('views-n').textContent = d.count; $('views').hidden = false; }
      }).catch(function () {});
    }
  }

  // 捲動時依序浮現
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var targets = document.querySelectorAll('.sec-head, .about p, .member, .pub-group, .product, .contact');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var el = e.target;
        el.classList.add('in');
        io.unobserve(el);
        // 浮現完成後移除動畫設定，讓滑鼠移上去的效果即時反應
        setTimeout(function () { el.classList.remove('reveal', 'in'); el.style.transitionDelay = ''; }, 1100);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    targets.forEach(function (el) {
      var sib = el.parentElement ? Array.prototype.indexOf.call(el.parentElement.children, el) : 0;
      el.style.transitionDelay = Math.min(sib, 4) * 0.08 + 's';
      el.classList.add('reveal');
      io.observe(el);
    });
  }

  // 選單：捲到哪一區就標紅
  var links = document.querySelectorAll('nav a');
  function mark() {
    var cur = '';
    document.querySelectorAll('main section').forEach(function (s) {
      if (s.getBoundingClientRect().top < 160) cur = s.id;
    });
    links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + cur); });
  }
  window.addEventListener('scroll', mark, { passive: true });
  mark();
})();
</script>
</body>
</html>
